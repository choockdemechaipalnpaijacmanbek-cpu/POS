<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ POS และคลังสินค้า FIFO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-Qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

    <!-- Header Navigation -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-store"></i> ระบบ POS สต็อก FIFO
            </h1>
            <button onclick="syncData()" class="p-2 hover:bg-indigo-700 rounded-full transition" title="ซิงค์ข้อมูล">
                <i class="fa-solid fa-sync" id="syncIcon"></i>
            </button>
        </div>
        <!-- Tab Menu -->
        <div class="flex border-t border-indigo-500 bg-indigo-700 text-xs sm:text-sm">
            <button onclick="switchTab('pos')" id="tab-pos" class="flex-1 py-2 text-center font-medium border-b-4 border-white text-white">
                <i class="fa-solid fa-cart-shopping"></i> ขายสินค้า
            </button>
            <button onclick="switchTab('stock')" id="tab-stock" class="flex-1 py-2 text-center font-medium border-b-4 border-transparent text-indigo-200 hover:text-white">
                <i class="fa-solid fa-boxes-stacked"></i> รับสต็อก
            </button>
            <button onclick="switchTab('profit')" id="tab-profit" class="flex-1 py-2 text-center font-medium border-b-4 border-transparent text-indigo-200 hover:text-white">
                <i class="fa-solid fa-chart-line"></i> สรุปกำไร
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- TAB 1: POS (หน้าขายสินค้า) -->
        <section id="section-pos" class="space-y-4">
            <div id="pos-scanner-container" class="hidden bg-black rounded-lg overflow-hidden relative shadow-md mb-2">
                <div id="pos-reader" class="w-full"></div>
                <button onclick="stopPosScanner()" class="absolute top-2 right-2 bg-red-600 text-white px-3 py-1 rounded-full text-xs shadow z-50">
                    ปิดกล้อง
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-2">
                <input type="text" id="pos-barcode" placeholder="ยิงหรือพิมพ์บาร์โค้ด..." 
                    class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="startPosScanner()" class="bg-slate-700 text-white px-3 py-2 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-camera"></i>
                </button>
                <button onclick="addPosItem()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
                    เพิ่ม
                </button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center">
                    <span>รายการสั่งซื้อในตะกร้า</span>
                    <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">ล้างตะกร้า</button>
                </div>
                <div id="cart-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto">
                    <p class="text-center text-slate-400 py-6">ยังไม่มีสินค้าในตะกร้า</p>
                </div>
                <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
                    <div class="flex justify-between text-lg font-bold">
                        <span>ราคารวมทั้งสิ้น:</span>
                        <span id="cart-total" class="text-indigo-600">0.00 ฿</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-emerald-700 shadow-md transition">
                        <i class="fa-solid fa-cash-register"></i> ชำระเงิน (ตัดสต็อก FIFO)
                    </button>
                </div>
            </div>
        </section>

        <!-- TAB 2: STOCK (หน้าเพิ่มสต็อก) -->
        <section id="section-stock" class="space-y-4 hidden">
            <div id="stock-scanner-container" class="hidden bg-black rounded-lg overflow-hidden relative shadow-md mb-2">
                <div id="stock-reader" class="w-full"></div>
                <button onclick="stopStockScanner()" class="absolute top-2 right-2 bg-red-600 text-white px-3 py-1 rounded-full text-xs shadow z-50">
                    ปิดกล้อง
                </button>
            </div>

            <form id="stock-form" onsubmit="saveStock(event)" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="font-bold text-slate-700 border-b pb-2">รับสินค้าเข้าสต็อก (ระบบ FIFO)</h2>
                
                <div>
                    <label class="text-xs text-slate-500 font-semibold">รหัสบาร์โค้ด</label>
                    <div class="flex gap-2 mt-1">
                        <input type="text" id="stock-barcode" required onchange="checkExistingBarcode(this.value)" placeholder="เช่น 885001..."
                            class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button type="button" onclick="startStockScanner()" class="bg-slate-700 text-white px-3 py-2 rounded-lg text-sm">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-500 font-semibold">ชื่อสินค้า</label>
                    <input type="text" id="stock-name" required placeholder="เช่น น้ำดื่ม..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-xs text-slate-500 font-semibold">จำนวนรับ</label>
                        <input type="number" id="stock-qty" min="1" required placeholder="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-semibold">ทุน/หน่วย</label>
                        <input type="number" step="0.01" id="stock-cost" min="0" required placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-semibold">ขาย/หน่วย</label>
                        <input type="number" step="0.01" id="stock-price" min="0" required placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition">
                    บันทึกรับเข้าสต็อก
                </button>
            </form>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700">
                    สต็อกสินค้าคงเหลือ (แยกตามล็อต FIFO)
                </div>
                <div id="inventory-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto p-2">
                    <!-- Dynamic Inventory -->
                </div>
            </div>
        </section>

        <!-- TAB 3: PROFIT & HISTORY (สรุปกำไรและประวัติ) -->
        <section id="section-profit" class="space-y-4 hidden">
            <!-- Summary Cards -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
                    <div class="text-xs text-slate-400 font-medium">ยอดขายรวมทั้งหมด</div>
                    <div id="total-sales-amount" class="text-lg font-bold text-indigo-600 mt-1">0.00 ฿</div>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-center">
                    <div class="text-xs text-slate-400 font-medium">กำไรสุทธิรวม</div>
                    <div id="total-profit-amount" class="text-lg font-bold text-emerald-600 mt-1">0.00 ฿</div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center">
                    <span>ประวัติการขายและกำไร</span>
                    <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">ล้างประวัติ</button>
                </div>
                <div id="history-list" class="divide-y divide-slate-100 max-h-96 overflow-y-auto p-2">
                    <p class="text-center text-slate-400 py-6">ยังไม่มีประวัติการขาย</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        let inventory = JSON.parse(localStorage.getItem('fifo_inventory')) || [];
        let salesHistory = JSON.parse(localStorage.getItem('fifo_sales')) || [];
        let cart = [];
        let posScanner = null;
        let stockScanner = null;

        function saveData() {
            localStorage.setItem('fifo_inventory', JSON.stringify(inventory));
            localStorage.setItem('fifo_sales', JSON.stringify(salesHistory));
            renderInventory();
        }

        function switchTab(tab) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            
            ['pos', 'stock', 'profit'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 text-center font-medium border-b-4 border-white text-white";
                } else {
                    btn.className = "flex-1 py-2 text-center font-medium border-b-4 border-transparent text-indigo-200 hover:text-white";
                }
            });

            if (tab === 'stock') renderInventory();
            if (tab === 'profit') renderProfitAndHistory();
            stopAllScanners();
        }

        function checkExistingBarcode(barcode) {
            const existing = inventory.find(i => i.barcode === barcode);
            if (existing) {
                document.getElementById('stock-name').value = existing.name;
                document.getElementById('stock-cost').value = existing.cost;
                document.getElementById('stock-price').value = existing.price;
            }
        }

        function saveStock(e) {
            e.preventDefault();
            const barcode = document.getElementById('stock-barcode').value.trim();
            const name = document.getElementById('stock-name').value.trim();
            const qty = parseInt(document.getElementById('stock-qty').value);
            const cost = parseFloat(document.getElementById('stock-cost').value);
            const price = parseFloat(document.getElementById('stock-price').value);

            inventory.push({
                id: Date.now(),
                barcode,
                name,
                qty,
                cost,
                price,
                date: new Date().toISOString()
            });

            saveData();
            document.getElementById('stock-form').reset();
            alert('เพิ่มสินค้าเข้าสต็อกสำเร็จ!');
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            if (inventory.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 py-4">ไม่มีสินค้าในสต็อก</p>';
                return;
            }

            list.innerHTML = inventory.map(item => `
                <div class="p-3 flex justify-between items-center text-sm">
                    <div>
                        <div class="font-bold text-slate-800">${item.name}</div>
                        <div class="text-xs text-slate-400">รหัส: ${item.barcode} | ทุน: ${item.cost}฿ | ขาย: ${item.price}฿</div>
                    </div>
                    <span class="bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-full text-xs">
                        เหลือ ${item.qty} ชิ้น
                    </span>
                </div>
            `).join('');
        }

        function addPosItem() {
            const barcodeInput = document.getElementById('pos-barcode');
            const barcode = barcodeInput.value.trim();
            if (!barcode) return;

            const availableQty = inventory.filter(i => i.barcode === barcode).reduce((sum, i) => sum + i.qty, 0);
            
            if (availableQty === 0) {
                alert('สินค้าหมด หรือไม่มีในสต็อก!');
                return;
            }

            const itemInCart = cart.find(c => c.barcode === barcode);
            const currentCartQty = itemInCart ? itemInCart.qty : 0;

            if (currentCartQty + 1 > availableQty) {
                alert('สินค้าในสต็อกมีไม่เพียงพอ!');
                return;
            }

            const product = inventory.find(i => i.barcode === barcode);

            if (itemInCart) {
                itemInCart.qty += 1;
            } else {
                cart.push({
                    barcode,
                    name: product.name,
                    price: product.price,
                    qty: 1
                });
            }

            barcodeInput.value = '';
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 py-6">ยังไม่มีสินค้าในตะกร้า</p>';
                totalEl.textContent = '0.00 ฿';
                return;
            }

            let total = 0;
            list.innerHTML = cart.map((item, index) => {
                const sum = item.price * item.qty;
                total += sum;
                return `
                    <div class="p-3 flex justify-between items-center text-sm">
                        <div class="flex-1">
                            <div class="font-bold text-slate-800">${item.name}</div>
                            <div class="text-xs text-slate-400">${item.price} ฿ x ${item.qty}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-700">${sum.toFixed(2)} ฿</span>
                            <button onclick="removeCartItem(${index})" class="text-red-500 hover:text-red-700 p-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.textContent = `${total.toFixed(2)} ฿`;
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        // FIFO Checkout & Cost/Profit Calculation
        function checkout() {
            if (cart.length === 0) {
                alert('โปรดเลือกสินค้าลงตะกร้าก่อน!');
                return;
            }

            let totalSale = 0;
            let totalCost = 0;
            let soldItemsDetail = [];

            cart.forEach(cartItem => {
                let remainingToDeduct = cartItem.qty;
                let itemSale = cartItem.price * cartItem.qty;
                totalSale += itemSale;

                for (let i = 0; i < inventory.length; i++) {
                    if (inventory[i].barcode === cartItem.barcode && inventory[i].qty > 0) {
                        let deductQty = Math.min(inventory[i].qty, remainingToDeduct);
                        totalCost += inventory[i].cost * deductQty;
                        
                        inventory[i].qty -= deductQty;
                        remainingToDeduct -= deductQty;

                        if (remainingToDeduct === 0) break;
                    }
                }

                soldItemsDetail.push({
                    name: cartItem.name,
                    qty: cartItem.qty,
                    price: cartItem.price
                });
            });

            // Clean up 0 quantity stock
            inventory = inventory.filter(i => i.qty > 0);

            const totalProfit = totalSale - totalCost;

            const transaction = {
                id: Date.now(),
                items: soldItemsDetail,
                totalSale,
                totalCost,
                totalProfit,
                date: new Date().toLocaleString('th-TH')
            };

            salesHistory.unshift(transaction);
            saveData();
            clearCart();
            alert(`ชำระเงินสำเร็จ!\nยอดขาย: ${totalSale.toFixed(2)} ฿\nกำไรสุทธิ: ${totalProfit.toFixed(2)} ฿`);
        }

        function renderProfitAndHistory() {
            const list = document.getElementById('history-list');
            const totalSalesEl = document.getElementById('total-sales-amount');
            const totalProfitEl = document.getElementById('total-profit-amount');

            let sumSales = 0;
            let sumProfit = 0;

            salesHistory.forEach(h => {
                sumSales += h.totalSale || 0;
                sumProfit += h.totalProfit || 0;
            });

            totalSalesEl.textContent = `${sumSales.toFixed(2)} ฿`;
            totalProfitEl.textContent = `${sumProfit.toFixed(2)} ฿`;

            if (salesHistory.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-400 py-6">ยังไม่มีประวัติการขาย</p>';
                return;
            }

            list.innerHTML = salesHistory.map(h => `
                <div class="p-3 text-sm space-y-1">
                    <div class="flex justify-between font-bold text-slate-700">
                        <span>ใบเสร็จ #${h.id.toString().slice(-6)}</span>
                        <span class="text-emerald-600">กำไร +${(h.totalProfit || 0).toFixed(2)} ฿</span>
                    </div>
                    <div class="text-xs text-slate-400 flex justify-between">
                        <span>${h.date}</span>
                        <span class="text-indigo-600 font-semibold">ยอดขาย: ${(h.totalSale || 0).toFixed(2)} ฿</span>
                    </div>
                    <div class="text-xs text-slate-600 pt-1 border-t border-slate-100">
                        ${h.items.map(i => `${i.name} (${i.qty} ชิ้น)`).join(', ')}
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('ต้องการล้างประวัติการขายทั้งหมดใช่หรือไม่?')) {
                salesHistory = [];
                saveData();
                renderProfitAndHistory();
            }
        }

        // Scanner Controls
        function stopAllScanners() {
            if (posScanner) {
                posScanner.stop().catch(() => {}).finally(() => { posScanner = null; });
            }
            if (stockScanner) {
                stockScanner.stop().catch(() => {}).finally(() => { stockScanner = null; });
            }
            document.getElementById('pos-scanner-container').classList.add('hidden');
            document.getElementById('stock-scanner-container').classList.add('hidden');
        }

        function startPosScanner() {
            stopAllScanners();
            document.getElementById('pos-scanner-container').classList.remove('hidden');
            posScanner = new Html5Qrcode("pos-reader");
            posScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    document.getElementById('pos-barcode').value = decodedText;
                    addPosItem();
                    stopAllScanners();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("ไม่สามารถเปิดกล้องได้: " + err);
                document.getElementById('pos-scanner-container').classList.add('hidden');
            });
        }

        function stopPosScanner() { stopAllScanners(); }

        function startStockScanner() {
            stopAllScanners();
            document.getElementById('stock-scanner-container').classList.remove('hidden');
            stockScanner = new Html5Qrcode("stock-reader");
            stockScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    document.getElementById('stock-barcode').value = decodedText;
                    checkExistingBarcode(decodedText);
                    stopAllScanners();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("ไม่สามารถเปิดกล้องได้: " + err);
                document.getElementById('stock-scanner-container').classList.add('hidden');
            });
        }

        function stopStockScanner() { stopAllScanners(); }

        function syncData() {
            saveData();
            alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
        }

        renderInventory();
    </script>
</body>
</html>
